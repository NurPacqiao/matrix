# One grouped pull request per ecosystem per month. Security fixes still arrive right away
# when "Dependabot security updates" is on in the repository settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /ohtani-frontend
    schedule: { interval: monthly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: nuget
    directories: [/OhtaniApi, /OhtaniApi.Tests]
    schedule: { interval: monthly }
    groups: { nuget: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
