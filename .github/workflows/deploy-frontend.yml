name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ohtani-frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ohtani-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ohtani-frontend/package-lock.json
      - run: npm ci
      - run: npm run check # lint, tests and build: nothing broken gets published
        env:
          BASE_PATH: /ohtaniApp/
          # Set under Settings → Secrets and variables → Actions (Variables or Secrets both work)
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID || secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ohtani-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job can publish, so a bad npm package in the build job can't
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
